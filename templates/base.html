<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}YouTube Sentiment Analyzer{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/base.css') }}">
  {% block extra_css %}{% endblock %}
</head>
<body>

  <header class="navbar">
    <div class="navbar-inner">
      <a href="/" class="brand">
        <span class="brand-icon">▶</span>
        <span>Sentiment<span class="brand-accent">Scope</span></span>
      </a>
      <span class="navbar-tagline">YouTube Comment Analyzer</span>
    </div>
  </header>

  <main class="page">
    {% block content %}{% endblock %}
  </main>

  <footer class="site-footer">
    <p>Made for creators — analyze audience sentiment in seconds.</p>
  </footer>

  {% block extra_js %}{% endblock %}
</body>
</html>
